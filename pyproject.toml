[project]
name = "suprdl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lyak01", email = "alexandermycrosoft212@outlook.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "platformdirs>=4.11.4",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.scripts]
suprdl = "suprdl.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
